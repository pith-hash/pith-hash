[workspace]
members = ["pith-hash-cli"]

[package]
name = "pith-hash"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The pith suite curator: detect, tier-1 content hash, tier-2 signatures, match, calibrate and the pith CLI."
readme = "README.md"
license = "MIT"
repository = "https://github.com/pith-hash/pith-hash"
homepage = "https://pith-hash.n24q02m.com"
categories = ["algorithms", "cryptography"]

[lib]
# The cdylib is the binary every language SDK binds through (ctypes,
# koffi, cgo); the rlib keeps the Rust consumers unchanged.
crate-type = ["cdylib", "rlib"]

[features]
# Default-on: the cdylib needs std for its panic handler. The library
# itself stays no_std-compatible (`--no-default-features` still builds).
default = ["std"]
std = []

# R5 pins the suite at its landed `main` heads (git, branch = "main").
# R6 publish flips these to the versioned `~0.1` pins of the suite
# contract (see README "Version pinning"); the switch is the only edit.
[dependencies]
# R5 (curator build) pins every suite crate by `git, branch = "main"` so the
# repository tracks the landed suite heads without a publish step. At R6
# (crates.io publish) each line switches to the versioned pin the suite
# contract requires, e.g. `pith-digest = "~0.1"`; this comment marks that
# switch. `Cargo.lock` records the exact heads this build is verified against.
pith-digest = { version = "0.1", git = "https://github.com/pith-hash/pith-digest.git", branch = "main" }
pith-math = { version = "0.1", git = "https://github.com/pith-hash/pith-math.git", branch = "main" }
pith-image = { version = "0.1", git = "https://github.com/pith-hash/pith-image.git", branch = "main" }
pith-png = { version = "0.1", git = "https://github.com/pith-hash/pith-png.git", branch = "main" }
pith-jpeg = { version = "0.1", git = "https://github.com/pith-hash/pith-jpeg.git", branch = "main" }
pith-text = { version = "0.1", git = "https://github.com/pith-hash/pith-text.git", branch = "main" }
pith-audio = { version = "0.1", git = "https://github.com/pith-hash/pith-audio.git", branch = "main" }
pith-flac = { version = "0.1", git = "https://github.com/pith-hash/pith-flac.git", branch = "main" }
pith-mp3 = { version = "0.1", git = "https://github.com/pith-hash/pith-mp3.git", branch = "main" }
pith-mp4 = { version = "0.1", git = "https://github.com/pith-hash/pith-mp4.git", branch = "main" }
pith-h264 = { version = "0.1", git = "https://github.com/pith-hash/pith-h264.git", branch = "main" }
pith-video = { version = "0.1", git = "https://github.com/pith-hash/pith-video.git", branch = "main" }
pith-file = { version = "0.1", git = "https://github.com/pith-hash/pith-file.git", branch = "main" }
pith-pdf = { version = "0.1", git = "https://github.com/pith-hash/pith-pdf.git", branch = "main" }

[dev-dependencies]
pith-unicode = { version = "0.1", git = "https://github.com/pith-hash/pith-unicode.git", branch = "main" }

[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

[profile.release]
lto = true
codegen-units = 1

# Ported from the upstream kit: codec inner loops (box average, DCT,
# FFT, H.264) under -O0 are unrealistically slow in hostile-input tests.
[profile.test]
opt-level = 2

# `unsafe_code` stays out of this table: the C ABI surface in
# src/ffi.rs, the language SDKs bind through, must re-allow it with an
# inner attribute, and `[lints]` entries become command-line flags
# that inner attributes cannot re-allow.
[lints.rust]
missing_docs = "deny"
