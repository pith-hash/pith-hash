[package]
name = "pith-hash-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The `pith` command line interface over the pith-hash suite facade."
readme = "../README.md"
license = "MIT"
repository = "https://github.com/pith-hash/pith-hash"
homepage = "https://pith-hash.n24q02m.com"
categories = ["algorithms", "cryptography"]

# In-workspace dependency on the curator facade. R6 publish adds the
# versioned `~0.1` pin alongside the path (suite contract, "Version
# pinning").
[dependencies]
pith-hash = { path = "..", version = "0.1" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[[bin]]
name = "pith"
path = "src/main.rs"
# rustdoc collision: this bin's `pith` docs would overwrite the facade
# crate's `target/doc/pith_hash/index.html`. CLI usage docs live in the
# `--help` screens instead.
doc = false
